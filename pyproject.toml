[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jalalix"
version = "0.2.0"
description = "Jalali (Persian/Shamsi) calendar for Python. Pure Python, no runtime dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Hossein Maklavani", email = "hos.mohamadi@gmail.com" },
]
keywords = [
  "jalalix",
  "jalali",
  "jalaali",
  "shamsi",
  "persian",
  "farsi",
  "khorshidi",
  "calendar",
  "date",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://jalalix.com"
Documentation = "https://jalalix.com"
Repository = "https://github.com/jalalix/python"
Issues = "https://github.com/jalalix/python/issues"
Funding = "https://opencollective.com/jalalix"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jalalix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
